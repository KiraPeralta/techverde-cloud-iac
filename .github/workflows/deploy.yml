name: DevOps IaC Pipeline - TechVerde Chile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deploy-and-test:
    name: Validar Terraform, Desplegar en AWS y Ejecutar Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: 3. Prueba Estatica - Validar formato y sintaxis Terraform
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive || true
          terraform validate
          echo "✅ Configuracion Terraform validada correctamente."

      - name: 4. Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: 5. Desplegar Infraestructura como Codigo (Terraform Apply)
        working-directory: infra
        run: |
          terraform init
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform import aws_s3_bucket.audit_logs "techverde-audit-logs-${ACCOUNT_ID}" || true
          terraform import aws_s3_bucket.web_hosting "techverde-web-${ACCOUNT_ID}" || true
          terraform import aws_cloudtrail.account_trail "techverde-security-trail" || true
          terraform import aws_cloudwatch_metric_alarm.http_4xx_alarm "TechVerde-High-4xx-Errors" || true
          terraform apply -auto-approve

      - name: 6. Sincronizar sitio web en S3 y capturar salidas
        id: tf_outputs
        working-directory: infra
        run: |
          WEBSITE_URL=$(terraform output -raw website_url)
          WEB_BUCKET=$(terraform output -raw web_bucket_name)
          LOGS_BUCKET=$(terraform output -raw logs_bucket_name)

          echo "Subiendo archivos web a $WEB_BUCKET..."
          aws s3 sync ../web/ "s3://$WEB_BUCKET/" --delete

          echo "website_url=$WEBSITE_URL" >> $GITHUB_OUTPUT
          echo "logs_bucket=$LOGS_BUCKET" >> $GITHUB_OUTPUT

      - name: 7. Prueba de Integracion - Ejecutar validaciones HTTP y Seguridad
        run: |
          chmod +x tests/test_deployment.sh
          ./tests/test_deployment.sh "${{ steps.tf_outputs.outputs.website_url }}" "${{ steps.tf_outputs.outputs.logs_bucket }}"
