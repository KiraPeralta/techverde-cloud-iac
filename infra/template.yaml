AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infraestructura como Codigo - Portal TechVerde Chile (S3, CloudWatch, CloudTrail, SNS y Seguridad)'

Parameters:
  AlertEmail:
    Type: String
    Description: Correo electronico para recibir alertas tempranas de CloudWatch

Resources:
  # 1. BUCKET DE LOGS Y AUDITORIA (100% Privado + Cifrado en reposo)
  AuditLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'techverde-audit-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Politica de minimo privilegio para que CloudTrail y S3 Logs escriban en el bucket privado
  AuditLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogsBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditLogsBucket.Arn}/s3-access-logs/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # 2. BUCKET WEB ESTATICO (Solo lectura publica + Versionado + Cifrado + Logs)
  WebHostingBucket:
    Type: AWS::S3::Bucket
    DependsOn: AuditLogsBucketPolicy
    Properties:
      BucketName: !Sub 'techverde-web-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref AuditLogsBucket
        LogFilePrefix: s3-access-logs/
      MetricsConfigurations:
        - Id: EntireBucketMetrics
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  # Politica restrictiva: permite unicamente lectura (GetObject) al publico
  WebHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebHostingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadOnlyGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebHostingBucket.Arn}/*'

  # 3. TRAZABILIDAD DE CUENTA (AWS CloudTrail)
  AccountTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditLogsBucketPolicy
    Properties:
      TrailName: techverde-security-trail
      S3BucketName: !Ref AuditLogsBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false

  # 4. NOTIFICACIONES Y ALARMA TEMPRANA (SNS + CloudWatch)
  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: techverde-incident-alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  Http4xxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: TechVerde-High-4xx-Errors
      AlarmDescription: Alerta temprana cuando se detectan 3 o mas errores HTTP 4xx en 5 minutos
      Namespace: AWS/S3
      MetricName: 4xxErrors
      Dimensions:
        - Name: BucketName
          Value: !Ref WebHostingBucket
        - Name: FilterId
          Value: EntireBucketMetrics
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic

Outputs:
  WebsiteURL:
    Description: URL publica del portal web estatico
    Value: !GetAtt WebHostingBucket.WebsiteURL
  WebBucketName:
    Description: Nombre del bucket web
    Value: !Ref WebHostingBucket
  LogsBucketName:
    Description: Nombre del bucket privado de auditoria
    Value: !Ref AuditLogsBucket
